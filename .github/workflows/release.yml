name: Release

# Stages the TypeScript packages on npm: `@txnlab/zs-proto` when a `ts/vX.Y.Z`
# tag is pushed, `@txnlab/zerosignal` (the SDK) on an `sdk/vX.Y.Z` tag. The two
# release in lockstep (`make check-lockstep`), so both tags go on one commit. Go
# needs no job: a `go/vX.Y.Z` tag is itself the release, fetched through the
# module proxy on first `go get` (as `@vX.Y.Z`) — provided go/go.mod declares
# this repo's path.
#
# This workflow can only STAGE. Each package's trusted-publisher entry on
# npmjs.com allows `npm stage publish` alone, so nothing it uploads is
# installable until a maintainer approves it with 2FA (`npm stage approve <id>`,
# or the package's "Staged Packages" tab). A compromised workflow, dependency,
# or token can therefore never ship a release by itself. Trusted publishing
# (OIDC) means there is no NPM_TOKEN secret to rotate. An entry can only be
# added to a package that exists, so a new package's first version is
# published by hand before its first tag.

on:
  push:
    tags: ['ts/v*', 'sdk/v*']

permissions:
  contents: read

jobs:
  publish-ts:
    name: Publish TypeScript package
    # This tree also lives in the private predecessor repo, which must never
    # publish from it.
    if: github.repository == 'TxnLab/zerosignal' && startsWith(github.ref_name, 'ts/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Not go-version-file — see ci.yml for why.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # `npm stage` needs npm >= 11.15.0 (and Node >= 22.14, which "22"
      # resolves to); Node 22 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Tag matches package version
        run: |
          want="ts/v$(node -p "require('./ts/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match ts/package.json ($want)" >&2
            exit 1
          fi

      # Provenance is rejected unless repository.url names the repo that built
      # it, and a restricted publishConfig would publish privately — fail here,
      # with a readable message, rather than at the registry.
      - name: Package metadata names this repo
        run: |
          url="$(node -p "require('./ts/package.json').repository.url")"
          access="$(node -p "require('./ts/package.json').publishConfig?.access ?? ''")"
          want="git+https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$url" != "$want" ]; then
            echo "ts/package.json repository.url is $url, want $want" >&2
            exit 1
          fi
          if [ "$access" != "public" ]; then
            echo "ts/package.json publishConfig.access is '$access', want public" >&2
            exit 1
          fi
          if ! grep -qx "module github.com/${GITHUB_REPOSITORY}/go" go/go.mod; then
            echo "go/go.mod does not declare github.com/${GITHUB_REPOSITORY}/go" >&2
            exit 1
          fi

      - name: Vet, typecheck, and test both implementations
        run: make vet typecheck test

      # Built explicitly rather than left to prepublishOnly, so the tarball
      # never depends on which lifecycle scripts `npm stage publish` runs.
      - name: Build
        working-directory: ts
        run: pnpm build

      # A prerelease must not become `latest`, or every unpinned install
      # picks it up.
      - name: Stage for approval
        working-directory: ts
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          npm stage publish --provenance --access public --tag "$dist_tag"

  publish-sdk:
    name: Publish SDK package
    if: github.repository == 'TxnLab/zerosignal' && startsWith(github.ref_name, 'sdk/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Not go-version-file — see ci.yml for why. make test runs the Go suite,
      # which generates the vectors both TypeScript suites read.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Tag matches package version
        run: |
          want="sdk/v$(node -p "require('./sdk/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match sdk/package.json ($want)" >&2
            exit 1
          fi

      - name: Package metadata names this repo
        run: |
          url="$(node -p "require('./sdk/package.json').repository.url")"
          access="$(node -p "require('./sdk/package.json').publishConfig?.access ?? ''")"
          want="git+https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$url" != "$want" ]; then
            echo "sdk/package.json repository.url is $url, want $want" >&2
            exit 1
          fi
          if [ "$access" != "public" ]; then
            echo "sdk/package.json publishConfig.access is '$access', want public" >&2
            exit 1
          fi

      # Equal version strings don't prove the published zs-proto is the ts/ this
      # job tests against: ts/ can change without a version bump. Only the
      # ts/ tag on this very commit does. The checkout fetched no tags, so ask
      # the remote; an annotated tag's ^{} line is the commit it points at.
      - name: zs-proto is tagged on this commit
        run: |
          tag="ts/v$(node -p "require('./ts/package.json').version")"
          refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          peeled="$(printf '%s\n' "$refs" | awk -v r="refs/tags/$tag^{}" '$2 == r {print $1}')"
          plain="$(printf '%s\n' "$refs" | awk -v r="refs/tags/$tag" '$2 == r {print $1}')"
          sha="${peeled:-$plain}"
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "$tag is at '${sha:-nothing}', not this commit ($GITHUB_SHA): tag both on one commit" >&2
            exit 1
          fi

      # make test builds ts/ (the SDK compiles against ts/dist), then builds the
      # SDK and checks the built package as a consumer resolves it.
      - name: Vet, typecheck, and run the full test suite
        run: make vet typecheck test

      # The SDK depends on `@txnlab/zs-proto` as `workspace:*`, which npm would
      # publish literally. `pnpm pack` writes the exact version instead, so the
      # job publishes the tarball rather than the source directory, packing the
      # dist make test built and checked.
      - name: Pack
        working-directory: sdk
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      # The SDK must name the zs-proto release it was built and tested with.
      - name: Packed dependency is the lockstep zs-proto
        run: |
          want="$(node -p "require('./ts/package.json').version")"
          got="$(tar -xzOf "$RUNNER_TEMP"/txnlab-zerosignal-*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).dependencies['@txnlab/zs-proto']")"
          if [ "$got" != "$want" ]; then
            echo "packed @txnlab/zs-proto is '$got', want $want" >&2
            exit 1
          fi

      # npm runs no lifecycle scripts for a tarball, so the SDK's
      # prepublishOnly (which needs the source tree) can't run here.
      - name: Stage for approval
        working-directory: sdk
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          npm stage publish "$RUNNER_TEMP"/txnlab-zerosignal-*.tgz --provenance --access public --tag "$dist_tag"
