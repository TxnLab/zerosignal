name: CI

# On request, not on every push: `make test` runs locally before a push, so an
# automatic run on each PR commit and again on main repeated work already done.
# Dispatch it from the Actions tab, or label a PR `ci` to run it on that PR and
# its later commits. Nothing publishes without the suite: release.yml runs it on
# the release tags.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

# Cancel the older run when a newer commit lands on the same ref. Nothing here
# mutates shared state, so unlike client/ipfs.yml this group is ref-scoped and
# cancelling is free — it only reclaims runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet, typecheck, and test
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Deliberately NOT `go-version-file: go/go.mod`. setup-go feeds the go
      # directive to semver.satisfies as a RANGE, so a patch-level directive
      # (`go 1.27.0`) matches that ONE patch and CI silently stops taking Go
      # security releases. `1.27.x` accepts any patch; bump it when
      # moving to a new minor.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: go/go.sum

      # setup-go takes a 1.27 patch from the runner's cache or its own
      # manifest, both of which trail go.dev after a release, and it exports
      # GOTOOLCHAIN=local so the go command stays on it. Setting GOTOOLCHAIN
      # to the newest patch makes the go command fetch that one itself,
      # checked against the Go checksum database. The list is not checked, so
      # only a bare version from it reaches GITHUB_ENV.
      - name: Use the newest Go patch
        run: |
          minor="$(go env GOVERSION | cut -d. -f1-2)"
          tc="$(curl -fsSL --max-time 30 --retry 3 --proto '=https' 'https://go.dev/dl/?mode=json' | jq -r --arg m "$minor." '[.[].version | select(startswith($m))] | first')"
          [[ "$tc" =~ ^go1\.[0-9]+\.[0-9]+$ ]] || { echo "::error::go.dev lists no supported $minor release"; exit 1; }
          echo "GOTOOLCHAIN=$tc" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Vet and typecheck
        run: make vet typecheck

      - name: Test both implementations
        run: make test

  race:
    name: Race test Go implementation
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Deliberately NOT `go-version-file: go/go.mod`. setup-go feeds the go
      # directive to semver.satisfies as a RANGE, so a patch-level directive
      # (`go 1.27.0`) matches that ONE patch and CI silently stops taking Go
      # security releases. `1.27.x` accepts any patch; bump it when
      # moving to a new minor.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: go/go.sum

      # setup-go takes a 1.27 patch from the runner's cache or its own
      # manifest, both of which trail go.dev after a release, and it exports
      # GOTOOLCHAIN=local so the go command stays on it. Setting GOTOOLCHAIN
      # to the newest patch makes the go command fetch that one itself,
      # checked against the Go checksum database. The list is not checked, so
      # only a bare version from it reaches GITHUB_ENV.
      - name: Use the newest Go patch
        run: |
          minor="$(go env GOVERSION | cut -d. -f1-2)"
          tc="$(curl -fsSL --max-time 30 --retry 3 --proto '=https' 'https://go.dev/dl/?mode=json' | jq -r --arg m "$minor." '[.[].version | select(startswith($m))] | first')"
          [[ "$tc" =~ ^go1\.[0-9]+\.[0-9]+$ ]] || { echo "::error::go.dev lists no supported $minor release"; exit 1; }
          echo "GOTOOLCHAIN=$tc" >> "$GITHUB_ENV"

      - name: Test with race detector
        working-directory: go
        run: go test -race ./...
